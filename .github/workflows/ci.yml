name: CI

on:
  push:
    branches:
      - main
      - 'automation/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK
        run: bash scripts/ci/ensure-android-sdk.sh

      - name: Verify and build candidate debug artifact
        env:
          ARTIFACT_OUTPUT_DIR: artifacts/ci-candidate-debug
        run: bash scripts/ci/build-channel.sh candidate debug

      - name: Publish candidate debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-debug-${{ github.sha }}
          path: artifacts/ci-candidate-debug/
          if-no-files-found: error
          retention-days: 30

      - name: Write summary
        if: always()
        run: |
          if [[ -s artifacts/ci-candidate-debug/artifact-manifest.json ]]; then
            {
              echo '## Candidate debug artifact'
              echo
              echo '```json'
              cat artifacts/ci-candidate-debug/artifact-manifest.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  emulator-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download candidate debug artifact
        uses: actions/download-artifact@v7
        with:
          name: candidate-debug-${{ github.sha }}
          path: artifacts/ci-candidate-debug

      - name: Resolve downloaded APK
        run: |
          apk="$(find artifacts/ci-candidate-debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo 'candidate debug APK not found' >&2; exit 1; }
          echo "APK_PATH=$GITHUB_WORKSPACE/$apk" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run adb runtime smoke gate
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/artifacts/emulator-smoke
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # Mol* needs WebGL2, which SwiftShader provides through OpenGL ES 3.0.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/ci/emulator-smoke.sh candidate debug

      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-${{ github.sha }}
          path: artifacts/emulator-smoke/
          if-no-files-found: warn
          retention-days: 30
